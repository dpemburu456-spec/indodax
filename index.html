<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Helayo - Crypto Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="logo">HELAYO <span>• indodax</span></div>

    <div class="fear-greed-card">
        <div class="fg-header">
            <span class="fg-title">FEAR & GREED INDEX</span>
            <span class="fg-value">62</span>
        </div>
        <div class="fg-bar"><div class="fg-fill" style="width: 62%;"></div></div>
        <div class="fg-status">🟡 Greed (Moderate)</div>
    </div>

    <div class="main-price">
        <div class="pair">BTC/USD • Indodax</div>
        <div class="price">$62,500</div>
        <div class="change positive">▲ +4,000 (+6.84%)</div>
        <div class="row-stats">
            <span>24h Vol: $1.2B</span>
            <span>High: $63,200</span>
        </div>
    </div>

    <div class="section-title"><i class="fas fa-chart-line" style="color: #FBBF24;"></i> Market pairs</div>
    <div class="asset-list" id="crypto-list">
        </div>

    <div class="ai-card">
        <div class="ai-text"><i class="fas fa-robot"></i> Dola AI</div>
        <div class="ai-badge">Beta • Voice</div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active"><i class="fas fa-home"></i><span>Home</span></div>
    <div class="nav-item"><i class="fas fa-chart-simple"></i><span>Markets</span></div>
    <div class="nav-item"><i class="fas fa-wallet"></i><span>Portfolio</span></div>
    <div class="nav-item"><i class="fas fa-gear"></i><span>Settings</span></div>
</div>

<script src="main.js"></script>
</body>
</html>
