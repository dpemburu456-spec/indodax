<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELAYO - Crypto Scanner 100</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f6fc; color: #1e293b; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .coin-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: 600; }
        button:hover { background: #1d4ed8; }
        h1 { margin-bottom: 15px; font-size: 1.5rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>HELAYO Scanner</h1>
        <p>Menampilkan 100 koin teratas berdasarkan Market Cap.</p>
        <button onclick="loadCoins()">Scan 100 Koin Sekarang</button>
    </div>

    <div class="card" id="coinList">
        <p style="text-align:center; color:#64748b;">Klik tombol di atas untuk memulai...</p>
    </div>
</div>

<script>
    async function loadCoins() {
        const listDiv = document.getElementById('coinList');
        listDiv.innerHTML = "Sedang memuat data 100 koin...";
        
        try {
            // API untuk ambil 100 koin
            const res = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false");
            const data = await res.json();
            
            listDiv.innerHTML = data.map(c => `
                <div class="coin-row">
                    <span><b>${c.symbol.toUpperCase()}</b> ${c.name}</span>
                    <span>$${c.current_price.toLocaleString()}</span>
                </div>
            `).join('');
        } catch (e) {
            listDiv.innerHTML = "Gagal memuat data. Periksa koneksi Anda.";
        }
    }
</script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/telegram.js"></script>
<script src="js/scanner.js"></script>
<script src="js/main.js"></script>

</body>
</html>
