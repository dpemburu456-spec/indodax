<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HELAYO - Crypto Scanner & Signals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-header">
    <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
    <div class="logo-area">
        <div class="logo-icon">H</div>
        <div class="logo-text">HELAYO</div>
    </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-menu">
        <div class="sidebar-item active" data-nav="beranda"><i class="fas fa-home"></i> Beranda</div>
        <div class="sidebar-item" data-nav="radar"><i class="fas fa-radar"></i> Setting Radar Scanner</div>
        <div class="sidebar-item" data-nav="indikator"><i class="fas fa-chart-line"></i> Setting Indikator</div>
        <div class="sidebar-item" data-nav="candlestick"><i class="fas fa-candlestick-chart"></i> Pola Candlestick</div>
        <div class="sidebar-item" data-nav="telegram"><i class="fab fa-telegram"></i> Bot Telegram</div>
        <div class="sidebar-item" data-nav="pengaturan"><i class="fas fa-sliders-h"></i> Pengaturan</div>
    </div>
</div>

<div class="main-content" id="mainContent">
    <div id="berandaView">
        <div class="dashboard-grid">
            <div class="card"><div class="card-header"><h3><i class="fas fa-trophy"></i> Ranking</h3><span class="badge-icon">Top 10</span></div><div id="rankList" class="coin-list">Memuat...</div></div>
            <div class="card"><div class="card-header"><h3><i class="fas fa-chart-simple"></i> Fear & Greed</h3></div><div id="fngDisplay" style="font-size: 1.8rem; font-weight: bold;">--</div><div id="fngText">--</div></div>
            <div class="card"><div class="card-header"><h3><i class="fas fa-globe"></i> Volume 24h</h3></div><div id="globalVolume" style="font-size: 1.7rem; font-weight: 700;">$--</div></div>
            <div class="card"><div class="card-header"><h3><i class="fas fa-fire"></i> Trending</h3></div><div id="trendingList" class="coin-list">Memuat...</div></div>
            <div class="card"><div class="card-header"><h3><i class="fas fa-bolt"></i> Pump Signal</h3></div><div><button id="scanNowBtn" style="width:100%;"><i class="fas fa-search"></i> Scan Sekarang</button><div id="pumpResults" class="scan-results">Klik Scan...</div><div style="margin-top:10px;"><span id="autoScanStatus" style="font-size:0.7rem; background:var(--badge-bg); padding:4px 8px; border-radius:20px;">⚙️ Auto-scan: OFF</span></div></div></div>
        </div>
    </div>
    <div id="dynamicPanel" style="display: none;"></div>
</div>

<!-- Load Scripts -->
<script src="js/api.js"></script>
<script src="js/settings.js"></script>
<script src="js/theme.js"></script>
<script src="js/telegram.js"></script>
<script src="js/scanner.js"></script>
<script src="js/main.js"></script>
</body>
</html>
